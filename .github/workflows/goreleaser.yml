name: GoReleaser

on:
  # release.yml now builds and publishes binaries inline (same job/run) right
  # after tagging, instead of relying on this push:tags trigger — that
  # cross-workflow trigger proved unreliable (see PR #30/#31 history). This
  # workflow stays as a manual escape hatch only, for re-running the build
  # against an already-tagged release if it ever needs a rebuild:
  # `gh workflow run goreleaser.yml --ref vX.Y.Z`.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  goreleaser:
    name: Release binaries
    runs-on: ubuntu-latest
    concurrency:
      group: goreleaser-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
